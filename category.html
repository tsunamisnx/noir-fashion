<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR — Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --black:#0a0a0a; --dark:#111; --card:#161616; --border:#222; --gray:#888; --light-gray:#ccc; --off-white:#f5f5f0; --accent:#c9a96e; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--black); color:var(--off-white); font-family:'Inter',sans-serif; font-weight:300; overflow-x:hidden; letter-spacing:.3px; }
        ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:var(--black); } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

        .navbar-noir { background:rgba(10,10,10,.97)!important; backdrop-filter:blur(30px); border-bottom:1px solid var(--border); padding:18px 0; transition:all .4s ease; }
        .navbar-noir.scrolled { padding:10px 0; }
        .brand-noir { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:32px; color:var(--off-white)!important; letter-spacing:12px; text-decoration:none; text-transform:uppercase; }
        .navbar-noir .nav-link { font-family:'Inter',sans-serif; font-weight:300; font-size:12px; letter-spacing:2.5px; text-transform:uppercase; color:var(--gray)!important; padding:8px 22px!important; transition:color .3s; }
        .navbar-noir .nav-link:hover { color:var(--off-white)!important; }
        .nav-icons { display:flex; align-items:center; gap:20px; margin-left:30px; }
        .nav-icon-link { color:var(--gray); font-size:16px; transition:color .3s; position:relative; }
        .nav-icon-link:hover { color:var(--off-white); }
        .cart-count { position:absolute; top:-8px; right:-10px; background:var(--accent); color:var(--black); font-size:9px; font-weight:600; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .navbar-toggler { border-color:var(--border)!important; }
        .navbar-toggler-icon { background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28245,245,240,0.7%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='1' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e")!important; }

        .category-hero { height:50vh; min-height:400px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
        .category-hero-bg { position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:.3; filter:grayscale(40%); }
        .category-hero-bg::after { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(to bottom,rgba(10,10,10,.2),rgba(10,10,10,.85)); }
        .category-hero-content { position:relative; z-index:2; text-align:center; }
        .category-hero-label { font-size:11px; letter-spacing:6px; text-transform:uppercase; color:var(--accent); margin-bottom:20px; font-weight:400; }
        .category-hero-title { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:56px; letter-spacing:6px; text-transform:uppercase; color:var(--off-white); margin-bottom:16px; }
        .category-hero-count { font-size:13px; color:var(--gray); letter-spacing:3px; text-transform:uppercase; font-weight:200; }

        .breadcrumb-noir { display:flex; justify-content:center; gap:8px; margin-top:20px; list-style:none; padding:0; }
        .breadcrumb-noir li { font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:200; }
        .breadcrumb-noir li a { color:var(--gray); text-decoration:none; transition:color .3s; }
        .breadcrumb-noir li a:hover { color:var(--off-white); }
        .breadcrumb-noir li.active { color:var(--off-white); }
        .breadcrumb-noir .separator { color:var(--border); margin:0 4px; }

        .filters-section { padding:30px 0 10px; border-bottom:1px solid var(--border); }
        .filter-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
        .filter-left { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
        .filter-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--gray); font-weight:400; }
        .filter-tags { display:flex; gap:8px; flex-wrap:wrap; }
        .filter-tag { padding:6px 16px; border:1px solid var(--border); border-radius:2px; font-size:11px; letter-spacing:1px; color:var(--gray); cursor:pointer; transition:all .2s; background:transparent; font-weight:300; }
        .filter-tag:hover { border-color:var(--off-white); color:var(--off-white); }
        .filter-tag.active { border-color:var(--accent); color:var(--accent); }
        .filter-select { background:transparent; border:1px solid var(--border); border-radius:0; color:var(--off-white); font-family:'Inter',sans-serif; font-size:12px; font-weight:300; letter-spacing:1px; padding:8px 34px 8px 16px; cursor:pointer; appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28245,245,240,0.4%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='1' d='M6 10l9 9 9-9'/%3e%3c/svg%3e"); background-repeat:no-repeat; background-position:right 10px center; background-size:14px; }
        .filter-select option { background:var(--card); color:var(--off-white); }
        .filter-select:focus { border-color:var(--accent); outline:none; }

        .products-section { padding:50px 0 80px; }
        .product-card { background:transparent; border:1px solid var(--border); border-radius:4px; overflow:hidden; transition:all .4s; margin-bottom:30px; cursor:pointer; }
        .product-card:hover { border-color:rgba(201,169,110,.3); transform:translateY(-6px); box-shadow:0 20px 60px rgba(0,0,0,.4); }
        .product-img { height:340px; overflow:hidden; position:relative; background:var(--dark); }
        .product-img img { width:100%; height:100%; object-fit:cover; transition:transform .6s,filter .4s; filter:grayscale(20%); }
        .product-card:hover .product-img img { transform:scale(1.05); filter:grayscale(0%); }
        .product-badge { position:absolute; top:14px; left:14px; padding:4px 12px; font-size:9px; font-weight:500; letter-spacing:2px; text-transform:uppercase; border-radius:2px; }
        .badge-new { background:var(--accent); color:var(--black); }
        .badge-sale { background:#c0392b; color:#fff; }
        .badge-sold-out { background:var(--border); color:var(--gray); }
        .product-wishlist { position:absolute; top:14px; right:14px; width:36px; height:36px; background:rgba(10,10,10,.6); border:1px solid rgba(245,245,240,.1); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--gray); font-size:14px; opacity:0; transition:all .3s; cursor:pointer; }
        .product-card:hover .product-wishlist { opacity:1; }
        .product-wishlist:hover { color:var(--accent); border-color:var(--accent); }
        .product-wishlist.active { color:var(--accent)!important; opacity:1!important; }
        .product-wishlist.active i { font-weight:900; }
        .product-body { padding:20px; }
        .product-brand { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--accent); font-weight:400; margin-bottom:6px; }
        .product-name { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:400; letter-spacing:1px; color:var(--off-white); margin-bottom:12px; }
        .product-price { font-size:14px; font-weight:300; color:var(--light-gray); letter-spacing:1px; }
        .product-price .old-price { text-decoration:line-through; color:var(--gray); margin-right:10px; font-weight:200; }
        .product-sizes { margin-top:14px; display:flex; gap:6px; }
        .size-option { width:32px; height:32px; border:1px solid var(--border); border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:400; color:var(--gray); letter-spacing:.5px; transition:all .2s; cursor:pointer; }
        .size-option:hover { border-color:var(--off-white); color:var(--off-white); }
        .size-option.selected { border-color:var(--accent); color:var(--accent); }
        .add-to-cart-btn { display:inline-block; margin-top:16px; padding:10px 24px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-family:'Inter',sans-serif; font-size:10px; font-weight:400; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .3s; }
        .add-to-cart-btn:hover { background:var(--accent); color:var(--black); }

        .footer-noir { border-top:1px solid var(--border); padding:30px 0; }
        .footer-bottom { display:flex; justify-content:space-between; align-items:center; color:var(--gray); font-size:11px; letter-spacing:1px; font-weight:200; }

        .toast-noir { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent); padding:14px 24px; color:var(--off-white); font-family:'Inter',sans-serif; font-size:13px; font-weight:300; letter-spacing:.5px; opacity:0; transform:translateX(40px); transition:all .4s; min-width:260px; }
        .toast-noir.show { opacity:1; transform:translateX(0); }

        .fade-in { opacity:0; transform:translateY(20px); transition:all .6s; }
        .fade-in.visible { opacity:1; transform:translateY(0); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-noir fixed-top">
        <div class="container">
            <a href="index.html" class="brand-noir">NOIR</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item active"><a class="nav-link" href="#">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Collections</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Contact</a></li>
                </ul>
                <div class="nav-icons">
                    <a href="index.html" class="nav-icon-link"><i class="fas fa-search"></i></a>
                    <a href="#" class="nav-icon-link"><i class="far fa-user"></i></a>
                    <a href="index.html" class="nav-icon-link"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span></a>
                </div>
            </div>
        </div>
    </nav>

    <section class="category-hero">
        <div class="category-hero-bg" id="heroBg"></div>
        <div class="category-hero-content">
            <div class="category-hero-label" id="heroLabel">Category</div>
            <h1 class="category-hero-title" id="heroTitle">Каталог</h1>
            <p class="category-hero-count" id="heroCount">0 товаров</p>
            <ul class="breadcrumb-noir">
                <li><a href="index.html">Магазин</a></li>
                <li class="separator">—</li>
                <li class="active" id="breadcrumbCat">Каталог</li>
            </ul>
        </div>
    </section>

    <section class="filters-section">
        <div class="container">
            <div class="filter-bar">
                <div class="filter-left">
                    <span class="filter-label">Бренд:</span>
                    <div class="filter-tags" id="brandFilters"></div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <select class="filter-select" id="sortSelect">
                        <option value="default">По умолчанию</option>
                        <option value="price-asc">Цена ↑</option>
                        <option value="price-desc">Цена ↓</option>
                        <option value="name">По названию</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <section class="products-section">
        <div class="container">
            <div class="row" id="productsGrid"></div>
        </div>
    </section>

    <div id="toastContainer" style="position:fixed;bottom:30px;right:30px;z-index:9999;display:flex;flex-direction:column;gap:10px;"></div>

    <footer class="footer-noir">
        <div class="container">
            <div class="footer-bottom">
                <span>&copy; 2026 NOIR. Все права защищены.</span>
                <span>Дизайн — GEEKER</span>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/category-data.js"></script>
    <script src="js/category-app.js"></script>
</body>
</html>
